label: 晚清 · 科幻诞生
labelEn: Late Qing · The Birth
start: 1840
end: 1911
kind: sf
summary: 1903 年鲁迅引入"科学小说"概念，1904 年《月球殖民地小说》成为首部原创科幻长篇， 晚清形成第一次科幻热潮。
summaryEn: >-
  Lu Xun introduced the concept of "science fiction" in 1903; Moon Colony Novel
  (1904) became the first original Chinese science fiction novel.
