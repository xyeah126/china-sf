<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2a33"/>
      <stop offset="100%" stop-color="#06161c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#sky)"/>
  <!-- 星图：北斗意象 -->
  <g fill="#0ea5b7" opacity="0.9">
    <circle cx="14" cy="13" r="1.7"/>
    <circle cx="24" cy="9" r="1.4"/>
    <circle cx="35" cy="12" r="1.7"/>
    <circle cx="45" cy="18" r="1.4"/>
    <circle cx="51" cy="27" r="1.7"/>
    <circle cx="46" cy="37" r="1.3"/>
    <circle cx="38" cy="42" r="1.6"/>
  </g>
  <g stroke="#0ea5b7" stroke-width="0.8" fill="none" opacity="0.45">
    <polyline points="14,13 24,9 35,12 45,18 51,27 46,37 38,42" stroke-dasharray="2 3"/>
  </g>
  <!-- 朱砂印 -->
  <rect x="18" y="20" width="28" height="28" rx="5" fill="#b03a2c"/>
  <rect x="21" y="23" width="22" height="22" rx="3" fill="none" stroke="#f7ece4" stroke-width="1.3" opacity="0.85"/>
  <text x="32" y="43" text-anchor="middle" font-family="STKaiti, KaiTi, STLiti, LiSu, SimSun, serif"
        font-size="24" fill="#f7ece4">幻</text>
</svg>
